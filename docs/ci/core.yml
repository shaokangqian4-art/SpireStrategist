name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.319
      - run: dotnet run --project tests/SpireStrategist.Tests -c Release
      - run: dotnet run --project tools/Evaluate -c Release -- artifacts/evaluation
      - run: dotnet run --project tools/LocalizationCatalog -c Release -- . --check
